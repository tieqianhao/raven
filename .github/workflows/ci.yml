name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce:
    name: 全链路复现 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 作者本机实测过的版本：3.12.9 与 3.13.12。未验证的版本不写进来。
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装 Node（对拍与 demo 冒烟测试需要）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 全链路（造数 → 训练 → 评测 → 报告 → demo → 对拍 → 冒烟）
        run: python run_all.py

      - name: 校验关键指标未漂移
        # 容差说明：模型训练用 `x @ w` 走 BLAS，Windows 与 Linux 的 OpenBLAS
        # 在浮点累加顺序上可能有 1e-7 级差异，经 SGD 迭代放大后可能翻转个别样本。
        # 本地（作者机器）用默认 1e-3 严格比对；CI 跨平台放宽到 5e-3，
        # 相当于允许 1~2 条样本翻转，仍足以拦截"特征改了却没更新文档"这类真实漂移。
        run: python tools/check_metrics.py --tol 5e-3

      - name: 校验 PDF/DOCX 构建脚本语法（简历源文件不入库，只做编译检查）
        run: |
          python -m py_compile resume/build_docx.py resume/verify.py
          echo "构建脚本语法正常"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-py${{ matrix.python }}
          path: |
            report.html
            demo/index.html
            artifacts/results/metrics.json
          retention-days: 7
